<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共用表情月曆</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 280px;
      background: #eef4fa;
      color: #19385a;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    main {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 20px 12px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .connection {
      min-height: 20px;
      margin-bottom: 18px;
      color: #587086;
      font-size: 14px;
    }

    .card {
      margin-bottom: 18px;
      padding: 20px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 6px 24px #19385a12;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #e6a638;
      outline-offset: 2px;
    }

    .label {
      display: block;
      margin-bottom: 9px;
      font-weight: bold;
    }

    input[type="date"] {
      display: block;
      width: 100%;
      max-width: 320px;
      margin-bottom: 22px;
      padding: 12px;
      border: 1px solid #a8bbce;
      border-radius: 10px;
      background: #fff;
      color: #19385a;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .choice {
      position: relative;
      min-width: 0;
      min-height: 92px;
      padding: 12px 5px;
      border: 2px solid #d4e0ec;
      border-radius: 14px;
      background: #f7fbff;
      color: #19385a;
      font-weight: bold;
    }

    .choice.selected {
      border-color: #2373b5;
      background: #dcefff;
    }

    .choice.selected::after {
      content: "✓";
      position: absolute;
      top: 5px;
      right: 9px;
      color: #2373b5;
    }

    .choice-emoji {
      display: block;
      margin-bottom: 5px;
      font-size: 34px;
      line-height: 1.2;
    }

    .selection-box {
      margin-bottom: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #f3f7fb;
    }

    .selection-title {
      margin-bottom: 6px;
      color: #536b80;
      font-size: 14px;
    }

    #selection {
      min-height: 34px;
      font-size: 27px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    #selection.empty {
      display: flex;
      align-items: center;
      color: #6c8092;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #save,
    #clear {
      min-height: 44px;
      padding: 11px 18px;
      border-radius: 10px;
    }

    #save {
      border: 0;
      background: #19385a;
      color: #fff;
      font-weight: bold;
    }

    #clear {
      border: 1px solid #b9cbdb;
      background: #fff;
      color: #536b80;
    }

    #message {
      min-height: 20px;
      margin: 13px 0 0;
      color: #256749;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .calendar {
      padding: 0;
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 15px;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 21px;
      text-align: center;
    }

    .month-button {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid #bfd0df;
      border-radius: 10px;
      background: #fff;
      color: #19385a;
      font-size: 26px;
      line-height: 1;
    }

    .weekdays,
    #days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays div {
      min-width: 0;
      padding: 10px 0;
      background: #e6f1fa;
      text-align: center;
      font-weight: bold;
    }

    .day,
    .blank {
      min-width: 0;
      min-height: 112px;
      padding: 6px;
      border: 0;
      border-top: 1px solid #e2ebf3;
      border-right: 1px solid #e2ebf3;
      background: #fff;
    }

    .day:nth-child(7n),
    .blank:nth-child(7n) {
      border-right: 0;
    }

    .day {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      color: #19385a;
      text-align: left;
    }

    .day:hover {
      background: #f2f8ff;
    }

    .day.selected-date {
      background: #e5f3ff;
      box-shadow: inset 0 0 0 2px #6ca4d1;
    }

    .number {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
    }

    .day.today .number {
      background: #19385a;
      color: #fff;
    }

    .day-records {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      justify-items: center;
      gap: 3px 0;
      margin-top: 7px;
    }

    .day-emoji {
      min-width: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .blank {
      background: #f8fbfe;
    }

    .note {
      margin: 0 2px;
      color: #60758a;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      main {
        padding: 16px 8px 32px;
      }

      h1 {
        font-size: 24px;
      }

      .card {
        padding: 16px;
      }

      .calendar {
        padding: 0;
      }

      .choices {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .choice {
        min-height: 80px;
      }

      .choice-emoji {
        font-size: 30px;
      }

      .calendar-header {
        padding: 12px;
      }

      .calendar-header h2 {
        font-size: 18px;
      }

      .day,
      .blank {
        min-height: 88px;
        padding: 3px;
      }

      .number {
        width: 23px;
        height: 23px;
        font-size: 12px;
      }

      .day-records {
        gap: 2px 0;
        margin-top: 5px;
      }

      .day-emoji {
        font-size: clamp(15px, 4.6vw, 21px);
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>共用表情月曆</h1>
    <div id="connection" class="connection" role="status">
      正在連線……
    </div>

    <section class="card">
      <fieldset id="record-form" disabled>
        <label class="label" for="record-date">日期</label>
        <input id="record-date" type="date">

        <span class="label">選擇表情，可複選</span>

        <div class="choices">
          <button
            class="choice"
            type="button"
            data-type="deer"
            aria-pressed="false"
          >
            <span class="choice-emoji" aria-hidden="true">🦌</span>
            鹿
          </button>

          <button
            class="choice"
            type="button"
            data-type="heart"
            aria-pressed="false"
          >
            <span class="choice-emoji" aria-hidden="true">❤️</span>
            愛心
          </button>

          <button
            class="choice"
            type="button"
            data-type="mouth"
            aria-pressed="false"
          >
            <span class="choice-emoji" aria-hidden="true">👄</span>
            嘴巴
          </button>

          <button
            class="choice"
            type="button"
            data-type="egg"
            aria-pressed="false"
          >
            <span class="choice-emoji" aria-hidden="true">🥚</span>
            蛋
          </button>
        </div>

        <div class="selection-box">
          <div class="selection-title">本次選擇</div>
          <div id="selection" aria-live="polite"></div>
        </div>

        <div class="actions">
          <button id="save" type="button">紀錄</button>
          <button id="clear" type="button">清空本次選擇</button>
        </div>
      </fieldset>

      <p id="message" role="status"></p>
    </section>

    <section class="card calendar" aria-label="共用月曆">
      <div class="calendar-header">
        <button
          id="prev"
          class="month-button"
          type="button"
          aria-label="上個月"
        >‹</button>

        <h2 id="month-title"></h2>

        <button
          id="next"
          class="month-button"
          type="button"
          aria-label="下個月"
        >›</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <div>日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>
      </div>

      <div id="days"></div>
    </section>

    <p class="note">
      點一下表情選取，再點一下取消。點月曆日期可以快速選日期。
      所有人共用紀錄，同一天同種表情只顯示一次。
    </p>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      where,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // 已填入你提供的 Firebase 專案設定
    const firebaseConfig = {
      apiKey: "AIzaSyC6d2OgZ4TfOZ80W8gVl8EKTywDBPrjUn8",
      authDomain: "fxxklist-84840.firebaseapp.com",
      projectId: "fxxklist-84840",
      storageBucket: "fxxklist-84840.firebasestorage.app",
      messagingSenderId: "109628544540",
      appId: "1:109628544540:web:41a1ebe067b747e06031d9"
    };

    const symbols = {
      deer: "🦌",
      heart: "❤️",
      mouth: "👄",
      egg: "🥚"
    };

    const names = {
      deer: "鹿",
      heart: "愛心",
      mouth: "嘴巴",
      egg: "蛋"
    };

    const types = ["deer", "heart", "mouth", "egg"];

    const dateInput = document.getElementById("record-date");
    const selectionElement = document.getElementById("selection");
    const daysElement = document.getElementById("days");
    const monthTitle = document.getElementById("month-title");
    const message = document.getElementById("message");
    const connection = document.getElementById("connection");
    const form = document.getElementById("record-form");
    const saveButton = document.getElementById("save");
    const choiceButtons = document.querySelectorAll(".choice");

    let db;
    let connected = false;
    let saving = false;
    let stopListening = null;
    let records = {};

    const selected = new Set();

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    const now = new Date();
    dateInput.value = formatDate(now);

    let currentMonth = new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b33636" : "#256749";
    }

    function renderSelection() {
      choiceButtons.forEach(button => {
        const isSelected = selected.has(button.dataset.type);

        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });

      const chosenTypes = types.filter(type => selected.has(type));

      selectionElement.classList.toggle(
        "empty",
        chosenTypes.length === 0
      );

      selectionElement.textContent = chosenTypes.length
        ? chosenTypes.map(type => symbols[type]).join(" ")
        : "尚未選擇表情";

      saveButton.disabled =
        !connected || saving || selected.size === 0;
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const today = formatDate(new Date());
      const firstWeekday = new Date(year, month, 1).getDay();
      const numberOfDays = new Date(year, month + 1, 0).getDate();

      monthTitle.textContent = `${year} 年 ${month + 1} 月`;
      daysElement.replaceChildren();

      function addBlank() {
        const blank = document.createElement("div");
        blank.className = "blank";
        daysElement.append(blank);
      }

      for (let i = 0; i < firstWeekday; i++) {
        addBlank();
      }

      for (let day = 1; day <= numberOfDays; day++) {
        const date = formatDate(new Date(year, month, day));
        const savedTypes = records[date] || new Set();

        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";

        if (date === today) {
          button.classList.add("today");
        }

        if (date === dateInput.value) {
          button.classList.add("selected-date");
        }

        const description = types
          .filter(type => savedTypes.has(type))
          .map(type => names[type])
          .join("、");

        button.setAttribute(
          "aria-label",
          `${year} 年 ${month + 1} 月 ${day} 日${description ? "，" + description : ""}`
        );

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = day;

        const entries = document.createElement("div");
        entries.className = "day-records";

        for (const type of types) {
          if (!savedTypes.has(type)) continue;

          const emoji = document.createElement("span");
          emoji.className = "day-emoji";
          emoji.textContent = symbols[type];
          emoji.setAttribute("aria-hidden", "true");
          entries.append(emoji);
        }

        button.append(number, entries);

        button.addEventListener("click", () => {
          if (saving) return;

          dateInput.value = date;
          showMessage("");
          renderCalendar();
        });

        daysElement.append(button);
      }

      const totalCells = firstWeekday + numberOfDays;
      const remaining = (7 - totalCells % 7) % 7;

      for (let i = 0; i < remaining; i++) {
        addBlank();
      }
    }

    function listenToMonth() {
      if (!connected) return;

      if (stopListening) {
        stopListening();
        stopListening = null;
      }

      records = {};
      renderCalendar();
      connection.textContent = "正在讀取本月紀錄……";

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();

      const start = formatDate(new Date(year, month, 1));
      const end = formatDate(new Date(year, month + 1, 1));

      const monthQuery = query(
        collection(db, "sharedEmojiRecords"),
        where("date", ">=", start),
        where("date", "<", end)
      );

      stopListening = onSnapshot(
        monthQuery,
        { includeMetadataChanges: true },
        snapshot => {
          records = {};

          snapshot.forEach(item => {
            const data = item.data();

            if (!records[data.date]) {
              records[data.date] = new Set();
            }

            for (const type of types) {
              if (
                typeof data[type] === "number" &&
                data[type] > 0
              ) {
                records[data.date].add(type);
              }
            }
          });

          connection.textContent = snapshot.metadata.fromCache
            ? "正在與雲端同步……"
            : "已連線・共用月曆即時同步";

          renderCalendar();
        },
        error => {
          connection.textContent = "紀錄讀取失敗";
          showMessage(
            `請檢查 Firestore 規則：${error.message}`,
            true
          );
        }
      );
    }

    choiceButtons.forEach(button => {
      button.addEventListener("click", () => {
        const type = button.dataset.type;

        if (selected.has(type)) {
          selected.delete(type);
        } else {
          selected.add(type);
        }

        renderSelection();
        showMessage("");
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      selected.clear();
      renderSelection();
      showMessage("");
    });

    dateInput.addEventListener("change", () => {
      if (!dateInput.value) return;

      const [year, month] = dateInput.value.split("-").map(Number);

      const changed =
        year !== currentMonth.getFullYear() ||
        month - 1 !== currentMonth.getMonth();

      currentMonth = new Date(year, month - 1, 1);

      if (changed) {
        listenToMonth();
      }

      renderCalendar();
    });

    function changeMonth(amount) {
      currentMonth = new Date(
        currentMonth.getFullYear(),
        currentMonth.getMonth() + amount,
        1
      );

      renderCalendar();
      listenToMonth();
    }

    document.getElementById("prev").addEventListener("click", () => {
      changeMonth(-1);
    });

    document.getElementById("next").addEventListener("click", () => {
      changeMonth(1);
    });

    saveButton.addEventListener("click", async () => {
      if (!connected || saving) return;

      if (!dateInput.value) {
        showMessage("請選擇日期", true);
        return;
      }

      if (selected.size === 0) {
        showMessage("請先選擇表情", true);
        return;
      }

      const date = dateInput.value;

      const data = {
        date,
        deer: selected.has("deer") ? 1 : 0,
        heart: selected.has("heart") ? 1 : 0,
        mouth: selected.has("mouth") ? 1 : 0,
        egg: selected.has("egg") ? 1 : 0,
        createdAt: serverTimestamp()
      };

      const [year, month] = date.split("-").map(Number);

      if (
        year !== currentMonth.getFullYear() ||
        month - 1 !== currentMonth.getMonth()
      ) {
        currentMonth = new Date(year, month - 1, 1);
        listenToMonth();
      }

      saving = true;
      form.disabled = true;
      saveButton.textContent = "儲存中……";
      showMessage("正在儲存到雲端……");

      try {
        await addDoc(collection(db, "sharedEmojiRecords"), data);

        selected.clear();
        showMessage(`已紀錄到 ${date}！`);
      } catch (error) {
        showMessage(`儲存失敗：${error.message}`, true);
      } finally {
        saving = false;
        form.disabled = false;
        saveButton.textContent = "紀錄";
        renderSelection();
      }
    });

    async function start() {
      renderSelection();
      renderCalendar();

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        db = getFirestore(app);

        // 背景自動匿名驗證，使用者不必操作登入
        await signInAnonymously(auth);

        connected = true;
        form.disabled = false;

        renderSelection();
        listenToMonth();
      } catch (error) {
        connection.textContent = "連線失敗";

        if (error.code === "auth/operation-not-allowed") {
          showMessage(
            "請先到 Firebase Authentication 啟用「匿名」登入。",
            true
          );
        } else {
          showMessage(
            `請檢查 Firebase 設定：${error.message}`,
            true
          );
        }
      }
    }

    start();
  </script>
</body>
</html>

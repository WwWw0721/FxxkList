<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>表情符號月曆</title>
  <style>
    :root {
      --background: #fff1f5;
      --card: #fffdfd;
      --text: #684c59;
      --muted: #927782;
      --border: #efd6df;
      --pink: #d77f9e;
      --pink-dark: #b9577d;
      --pink-light: #ffe4ed;
      --danger: #ad5068;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled { cursor: not-allowed; opacity: .55; }

    main {
      width: min(100% - 24px, 760px);
      margin: 24px auto 48px;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(25px, 6vw, 36px);
      color: var(--pink-dark);
    }

    .card {
      padding: 20px;
      margin-bottom: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 28px #b9577d12;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    #dateInput {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .hint {
      margin: 14px 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      display: flex;
      align-items: center;
      min-width: 0;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }

    .choice.has-count {
      border-color: var(--pink);
      background: var(--pink-light);
    }

    .add {
      flex: 1;
      min-width: 0;
      min-height: 72px;
      padding: 8px 2px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 30px;
    }

    .add .count {
      display: block;
      margin-top: 1px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .minus {
      align-self: stretch;
      width: 34px;
      border: 0;
      border-left: 1px solid var(--border);
      background: #ffffffaa;
      color: var(--pink-dark);
      font-size: 23px;
    }

    .save {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      background: var(--pink);
      color: #fff;
      font-weight: 700;
    }

    .save:hover:not(:disabled) { background: var(--pink-dark); }

    #status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .calendar-header h2 {
      margin: 0;
      text-align: center;
      font-size: 20px;
    }

    .month-button {
      min-width: 42px;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--pink-light);
      color: var(--pink-dark);
      font-size: 22px;
    }

    .weekdays, .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekdays {
      margin-bottom: 7px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .day {
      min-width: 0;
      min-height: 105px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      text-align: left;
      vertical-align: top;
    }

    .day.today { border-color: var(--pink); }
    .day.selected { background: #fff0f5; }
    .day.empty { background: transparent; border: 0; }

    .day-number {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    .day-emojis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
    }

    .day-emoji {
      min-width: 0;
      padding: 2px 1px;
      border-radius: 6px;
      background: var(--pink-light);
      text-align: center;
      font-size: 12px;
      white-space: nowrap;
    }

    .delete {
      min-height: 42px;
      margin-top: 14px;
      padding: 8px 14px;
      border: 1px solid #e6b8c6;
      border-radius: 10px;
      background: #fff;
      color: var(--danger);
    }

    @media (max-width: 600px) {
      main { width: calc(100% - 20px); margin-top: 16px; }
      .card { padding: 14px; border-radius: 16px; }
      .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .day { min-height: 88px; padding: 3px; border-radius: 7px; }
      .day-number { font-size: 12px; }
      .day-emojis { gap: 2px; }
      .day-emoji { font-size: 10px; padding: 2px 0; }
      .weekdays, .calendar { gap: 3px; }
    }

    @media (max-width: 360px) {
      .day-emoji { font-size: 9px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>表情符號月曆</h1>

    <section class="card">
      <label class="field-label" for="dateInput">紀錄日期</label>
      <input id="dateInput" type="date">

      <p class="hint">按符號增加次數；按 − 減少次數。</p>

      <div class="choices" id="choices">
        <div class="choice" data-key="deer">
          <button class="add" type="button" aria-label="鹿增加一次">🦌<span class="count">×0</span></button>
          <button class="minus" type="button" aria-label="鹿減少一次">−</button>
        </div>
        <div class="choice" data-key="heart">
          <button class="add" type="button" aria-label="愛心增加一次">❤️<span class="count">×0</span></button>
          <button class="minus" type="button" aria-label="愛心減少一次">−</button>
        </div>
        <div class="choice" data-key="mouth">
          <button class="add" type="button" aria-label="嘴巴增加一次">👄<span class="count">×0</span></button>
          <button class="minus" type="button" aria-label="嘴巴減少一次">−</button>
        </div>
        <div class="choice" data-key="egg">
          <button class="add" type="button" aria-label="蛋增加一次">🥚<span class="count">×0</span></button>
          <button class="minus" type="button" aria-label="蛋減少一次">−</button>
        </div>
      </div>

      <button class="save" id="saveButton" type="button" disabled>連線中…</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="calendar-header">
        <button class="month-button" id="prevMonth" type="button" aria-label="上個月">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="month-button" id="nextMonth" type="button" aria-label="下個月">›</button>
      </div>

      <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span>
        <span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar" id="calendar"></div>
      <button class="delete" id="deleteButton" type="button" hidden>刪除選定日期的所有紀錄</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, query, where, onSnapshot,
      getDocsFromServer, writeBatch, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6d2OgZ4TfOZ80W8gVl8EKTywDBPrjUn8",
      authDomain: "fxxklist-84840.firebaseapp.com",
      projectId: "fxxklist-84840",
      storageBucket: "fxxklist-84840.firebasestorage.app",
      messagingSenderId: "109628544540",
      appId: "1:109628544540:web:41a1ebe067b747e06031d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const records = collection(db, "sharedEmojiRecords");

    const emoji = {
      deer: "🦌",
      heart: "❤️",
      mouth: "👄",
      egg: "🥚"
    };
    const keys = Object.keys(emoji);
    const counts = { deer: 0, heart: 0, mouth: 0, egg: 0 };

    const dateInput = document.getElementById("dateInput");
    const choices = document.getElementById("choices");
    const saveButton = document.getElementById("saveButton");
    const deleteButton = document.getElementById("deleteButton");
    const status = document.getElementById("status");
    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");

    function localDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    const today = localDate(new Date());
    dateInput.value = today;

    let viewingYear = new Date().getFullYear();
    let viewingMonth = new Date().getMonth();
    let totals = new Map();
    let unsubscribe = null;
    let connected = false;
    let busy = false;

    function showStatus(message) {
      status.textContent = message;
    }

    function updateButtons() {
      for (const element of choices.querySelectorAll(".choice")) {
        const key = element.dataset.key;
        element.querySelector(".count").textContent = `×${counts[key]}`;
        element.classList.toggle("has-count", counts[key] > 0);
        element.querySelector(".minus").disabled = counts[key] === 0 || busy;
        element.querySelector(".add").disabled = busy || counts[key] >= 9999;
      }
      saveButton.disabled = !connected || busy;
      saveButton.textContent = busy ? "正在儲存至雲端…" : "紀錄";
      deleteButton.disabled = !connected || busy;
    }

    choices.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      const element = event.target.closest(".choice");
      if (!button || !element || busy) return;

      const key = element.dataset.key;
      if (button.classList.contains("add")) {
        counts[key] = Math.min(9999, counts[key] + 1);
      } else {
        counts[key] = Math.max(0, counts[key] - 1);
      }
      updateButtons();
    });

    function renderCalendar() {
      monthTitle.textContent = `${viewingYear} 年 ${viewingMonth + 1} 月`;
      calendar.replaceChildren();

      const firstWeekday = new Date(viewingYear, viewingMonth, 1).getDay();
      const numberOfDays = new Date(viewingYear, viewingMonth + 1, 0).getDate();

      for (let i = 0; i < firstWeekday; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.append(empty);
      }

      for (let day = 1; day <= numberOfDays; day++) {
        const date = localDate(new Date(viewingYear, viewingMonth, day));
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day";
        if (date === today) cell.classList.add("today");
        if (date === dateInput.value) cell.classList.add("selected");

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = String(day);
        cell.append(number);

        const dayTotals = totals.get(date);
        if (dayTotals) {
          const emojiGrid = document.createElement("span");
          emojiGrid.className = "day-emojis";

          for (const key of keys) {
            if (dayTotals[key] <= 0) continue;
            const item = document.createElement("span");
            item.className = "day-emoji";
            item.textContent = `${emoji[key]} ×${dayTotals[key]}`;
            emojiGrid.append(item);
          }
          cell.append(emojiGrid);
        }

        cell.addEventListener("click", () => {
          dateInput.value = date;
          renderCalendar();
        });
        calendar.append(cell);
      }

      deleteButton.hidden = !totals.has(dateInput.value);
    }

    function listenToMonth() {
      if (unsubscribe) unsubscribe();
      connected = false;
      totals = new Map();
      updateButtons();
      renderCalendar();
      showStatus("正在同步月曆…");

      const start = localDate(new Date(viewingYear, viewingMonth, 1));
      const end = localDate(new Date(viewingYear, viewingMonth + 1, 1));
      const monthQuery = query(
        records,
        where("date", ">=", start),
        where("date", "<", end)
      );

      unsubscribe = onSnapshot(
        monthQuery,
        { includeMetadataChanges: true },
        (snapshot) => {
          const nextTotals = new Map();

          for (const document of snapshot.docs) {
            const record = document.data();
            if (!nextTotals.has(record.date)) {
              nextTotals.set(record.date, {
                deer: 0, heart: 0, mouth: 0, egg: 0
              });
            }
            const sum = nextTotals.get(record.date);
            for (const key of keys) {
              const value = record[key];
              if (Number.isInteger(value) && value > 0) {
                sum[key] += value;
              }
            }
          }

          totals = nextTotals;
          connected = !snapshot.metadata.fromCache;
          renderCalendar();
          updateButtons();

          if (connected) {
            showStatus("");
          } else {
            showStatus("正在等待雲端連線…");
          }
        },
        (error) => {
          connected = false;
          updateButtons();
          showStatus(`月曆讀取失敗：${error.message}`);
        }
      );
    }

    function changeMonth(amount) {
      const next = new Date(viewingYear, viewingMonth + amount, 1);
      viewingYear = next.getFullYear();
      viewingMonth = next.getMonth();
      listenToMonth();
    }

    document.getElementById("prevMonth").addEventListener("click", () => changeMonth(-1));
    document.getElementById("nextMonth").addEventListener("click", () => changeMonth(1));

    dateInput.addEventListener("change", () => {
      if (!dateInput.value) return;
      const [year, month] = dateInput.value.split("-").map(Number);
      if (year !== viewingYear || month - 1 !== viewingMonth) {
        viewingYear = year;
        viewingMonth = month - 1;
        listenToMonth();
      } else {
        renderCalendar();
      }
    });

    saveButton.addEventListener("click", async () => {
      if (busy || !connected) return;
      if (!dateInput.value) {
        showStatus("請先選擇日期。");
        return;
      }
      if (!keys.some((key) => counts[key] > 0)) {
        showStatus("請先按至少一個表情符號。");
        return;
      }

      busy = true;
      updateButtons();
      showStatus("正在儲存至雲端…");

      const reminder = setTimeout(() => {
        showStatus("仍在等待雲端回應，請檢查網路連線。");
      }, 12000);

      try {
        await addDoc(records, {
          date: dateInput.value,
          deer: counts.deer,
          heart: counts.heart,
          mouth: counts.mouth,
          egg: counts.egg,
          createdAt: serverTimestamp()
        });

        for (const key of keys) counts[key] = 0;
        showStatus("紀錄成功！");
      } catch (error) {
        showStatus(`儲存失敗：${error.message}`);
      } finally {
        clearTimeout(reminder);
        busy = false;
        updateButtons();
      }
    });

    deleteButton.addEventListener("click", async () => {
      if (busy || !connected || !dateInput.value) return;
      const targetDate = dateInput.value;

      if (!confirm(`確定要刪除 ${targetDate} 的所有紀錄嗎？此操作無法復原。`)) {
        return;
      }

      busy = true;
      updateButtons();
      showStatus("正在刪除…");

      try {
        const dayQuery = query(records, where("date", "==", targetDate));
        const result = await getDocsFromServer(dayQuery);

        // Firestore 每批操作保留充足餘額，避免超過批次限制。
        for (let i = 0; i < result.docs.length; i += 400) {
          const batch = writeBatch(db);
          for (const document of result.docs.slice(i, i + 400)) {
            batch.delete(document.ref);
          }
          await batch.commit();
        }

        showStatus(`${targetDate} 的紀錄已刪除。`);
      } catch (error) {
        showStatus(`刪除失敗：${error.message}`);
      } finally {
        busy = false;
        updateButtons();
      }
    });

    updateButtons();
    renderCalendar();

    try {
      await signInAnonymously(auth);
      listenToMonth();
    } catch (error) {
      showStatus(`連線失敗：${error.message}`);
    }
  </script>
</body>
</html>
